services:

  app:
    build: .
    container_name: takeoff-app
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  postgres:
    image: postgres
    container_name: takeoff-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - takeoff-postgres-data:/var/lib/postgresql

volumes:
  takeoff-postgres-data:
    external: true