name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: takeoff_db
          POSTGRES_USER: takeoff_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U takeoff_app -d takeoff_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_DB: takeoff_db
      POSTGRES_USER: takeoff_app
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name takeoffacr2026

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database migrations
        run: python migration_runner.py

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: |
          docker build -t takeoff-app:ci .

      - name: Tag Docker image
        run: |
          docker tag takeoff-app:ci takeoffacr2026.azurecr.io/takeoff-app:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push takeoffacr2026.azurecr.io/takeoff-app:${{ github.sha }}
