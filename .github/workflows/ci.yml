name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: takeoff_db
          POSTGRES_USER: takeoff_app
          POSTGRES_PASSWORD: takeoff_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U takeoff_app -d takeoff_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create database table
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: takeoff_db
          POSTGRES_USER: takeoff_app
          POSTGRES_PASSWORD: takeoff_password
        run: |
          python -c "from database import create_table; create_table()"

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: takeoff_db
          POSTGRES_USER: takeoff_app
          POSTGRES_PASSWORD: takeoff_password
        run: |
          pytest

      - name: Build Docker image
        run: |
          docker build -t takeoff-app:ci .