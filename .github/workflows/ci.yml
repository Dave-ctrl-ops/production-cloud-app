name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: takeoff_db
          POSTGRES_USER: takeoff_app
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U takeoff_app -d takeoff_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      POSTGRES_DB: takeoff_db
      POSTGRES_USER: takeoff_app
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_HOST: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create database table
        run: |
          python -c "import psycopg; conn=psycopg.connect(dbname='takeoff_db', user='takeoff_app', password='ci_test_password', host='localhost'); cur=conn.cursor(); cur.execute('CREATE TABLE IF NOT EXISTS tasks (id SERIAL PRIMARY KEY, title TEXT NOT NULL, description TEXT, completed BOOLEAN DEFAULT FALSE)'); conn.commit(); cur.close(); conn.close()"

      - name: Run tests
        run: pytest

      - name: Build Docker image
        run: |
          docker build -t takeoff-app:ci .